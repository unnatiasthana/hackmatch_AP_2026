<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackMatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>HackMatch</h1><p>Find the hackathon that fits your skills.</p></header>
<main>
  <p id="message" role="status"></p>
  <section class="panel">
    <label for="user">Who are you?</label>
    <select id="user"></select>
    <div id="skills" class="chips"></div>
    <form id="skill-form">
      <input id="skill-input" placeholder="Add a skill (e.g. react)" autocomplete="off">
      <button>Add</button>
    </form>
  </section>
  <div class="two-boxes">
    <details id="signup-box" class="panel">
      <summary>New student? Sign up</summary>
      <form id="signup-form" class="big-form">
        <label>Name <input id="student-name" required></label>
        <label>Email <input id="student-email" type="email" required></label>
        <label>College <input id="student-college"></label>
        <label>Skills, separated by commas <input id="student-skills" placeholder="python, react"></label>
        <button>Sign up</button>
      </form>
    </details>
    <details id="event-box" class="panel">
      <summary>Add a hackathon</summary>
      <form id="event-form" class="big-form">
        <label>Name of event <input id="event-title" required></label>
        <label>Website link <input id="event-link" type="url" placeholder="https://" required></label>
        <label>Start date <input id="event-date" type="date" required></label>
        <label>Skills, separated by commas <input id="event-tags" placeholder="python, gen ai" required></label>
        <button>Save hackathon</button>
      </form>
    </details>
  </div>
  <section>
    <h2>Recommended for you</h2>
    <div id="feed" class="grid"></div>
  </section>
  <section>
    <h2>All hackathons</h2>
    <label for="filter">Filter by skill</label>
    <select id="filter"><option value="">All skills</option></select>
    <div id="all-hackathons" class="grid"></div>
  </section>
  <div class="two-boxes">
    <section class="panel">
      <h2>Trending skills</h2>
      <ol id="trending"></ol>
    </section>
    <section class="panel">
      <h2>Top colleges</h2>
      <ol id="colleges"></ol>
    </section>
  </div>
  <p class="empty">College project. The sample hackathons and students are dummy data.</p>
</main>
<script src="app.js"></script>
<script src="explore.js"></script>
<script src="signup.js"></script>
<script src="event-form.js"></script>
</body>
</html>
