<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackMatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>HackMatch</h1><p>Find the hackathon that fits your skills.</p></header>
<main>
  <p id="message" role="status"></p>
  <section class="panel">
    <label for="user">Who are you?</label>
    <select id="user"></select>
    <div id="skills" class="chips"></div>
    <form id="skill-form">
      <input id="skill-input" placeholder="Add a skill (e.g. react)" autocomplete="off">
      <button>Add</button>
    </form>
  </section>
  <section>
    <h2>Recommended for you</h2>
    <div id="feed" class="grid"></div>
  </section>
  <section>
    <h2>All hackathons</h2>
    <label for="filter">Filter by skill</label>
    <select id="filter"><option value="">All skills</option></select>
    <div id="all-hackathons" class="grid"></div>
  </section>
  <div class="two-boxes">
    <section class="panel">
      <h2>Trending skills</h2>
      <ol id="trending"></ol>
    </section>
    <section class="panel">
      <h2>Top colleges</h2>
      <ol id="colleges"></ol>
    </section>
  </div>
  <p class="empty">College project. The sample hackathons and students are dummy data.</p>
</main>
<script src="app.js"></script>
<script src="explore.js"></script>
</body>
</html>
